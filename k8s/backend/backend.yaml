apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-backend
  namespace: devsecops
  labels:
    app: devsecops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-backend
  template:
    metadata:
      labels:
        app: devsecops-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: devsecops/dashboard-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-service:5432/devopsdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-backend-service
  namespace: devsecops
spec:
  type: ClusterIP
  selector:
    app: devsecops-backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

