apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-frontend
  namespace: devsecops
  labels:
    app: devsecops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-frontend
  template:
    metadata:
      labels:
        app: devsecops-frontend
    spec:
      containers:
        - name: frontend
          image: devsecops/dashboard-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-frontend-service
  namespace: devsecops
spec:
  type: ClusterIP
  selector:
    app: devsecops-frontend
  ports:
    - port: 80
      targetPort: 80

