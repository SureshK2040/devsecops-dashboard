services:
  postgres:
    image: postgres:16-alpine
    container_name: devsecops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432" # mapped to 5433 locally to avoid collisions with any other running postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devsecops-net

  backend:
    build:
      context: ./devops-dashboard
      dockerfile: Dockerfile
    container_name: devsecops-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/devopsdb
      DB_USERNAME: postgres
      DB_PASSWORD: password123
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devsecops-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devsecops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devsecops-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devsecops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - devsecops-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: devsecops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - devsecops-net

volumes:
  postgres_data:
  grafana_data:

networks:
  devsecops-net:
    driver: bridge

